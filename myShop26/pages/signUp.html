<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>MySHOP inscription</title>
</head>

<body>
    <header>
        <!-- titre principal -->
        <h1>My Shop</h1>

        <!-- creer une liste non ordonnée -->
        <!-- menu de navigation -->
        <nav>
            <ul>
                <li><a href="../index.html">Accueil</a></li>
                <li><a href="about.html">A propos</a></li>
                <li><a href="products.html">Produits</a></li>
                <li><a href="signUp.html">Inscription</a></li>
                <li><a href="signIn.html">Connexion</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="panier.html">Mon Panier</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <!-- crétion d'un formulaire -->
            <form action="" method="">
                <h2>Inscription</h2>

                <!-- fieldset: englobe les informations liées, organise un formulaire -->
                <fieldset>
                    <!-- legend : titre dans fieldset -->
                    <legend>Informations personnelles</legend>

                    <!-- div: sert comme conteneur, revient a la ligne , type block -->
                    <div>
                        <label for="nom">Nom: </label>
                        <input type="text" id="nom" placeholder="Votre nom" required>
                    </div>
                    <div>
                        <label for="prenom">Prénom: </label>
                        <input type="text" id="prenom" placeholder="Votre prénom" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="exemple@gmail.com" required>
                    </div>
                    <div>
                        <label for="pwd">Mot de passe: </label>
                        <input type="password" id="pwd" placeholder="Votre mot de passe" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Informations supplémentaires</legend>

                    <!-- radio -->
                    <div>
                        <label>Genre: </label>
                        <input type="radio" id="femme" name="genre" value="femme">
                        <label for="femme">Femme</label>

                        <input type="radio" id="homme" name="genre" value="homme">
                        <label for="homme">Homme</label>

                        <input type="radio" id="autre" name="genre" value="autre">
                        <label for="autre">Autre</label>
                    </div>

                    <!-- checkbox -->
                    <div>
                        <label>Intérets: </label>
                        <input type="checkbox" name="interets" id="vetements" value="vetements">
                        <label for="vetements">Vêtements</label>

                        <input type="checkbox" name="interets" id="accessoires" value="accessoires">
                        <label for="accessoires">Accessoires</label>
                    </div>

                    <!-- liste deroulante -->
                    <div>
                        <label for="pays">Pays: </label>
                        <select name="pays" id="pays">
                            <option value="france">France</option>
                            <option value="tunisie">Tunisie</option>
                            <option value="espagne">Espagne</option>
                            <option value="autriche">Autriche</option>
                        </select>
                    </div>
                    <div>
                        <input type="checkbox" name="newsletter" id="newsletter" value="yes">
                        <label for="newsletter">S'inscrire à la newsletter</label>
                    </div>
                    <div>
                        <input type="checkbox" name="cgv" id="cgv" value="yes">
                        <label for="cgv">J'accepte les <a href="../assets/pdf/cgv1.pdf">conditions générales de
                                vente</a></label>
                    </div>
                </fieldset>
                <button type="submit" class="btn-signUp">S'inscrire</button>
            </form>
        </section>
    </main>

    <footer>
        <a href="https://www.instagram.com/" target="_blank"><i class="fa-brands fa-square-instagram"></i></a>
        <a href="https://www.linkedin.com/feed/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
        <a href="mailto:myshop@gmail.com">myshop@gmail.com</a>
        <a href="tel:0699674827"><i class="fa-solid fa-square-phone"></i></a>
        <!-- download: pour telecharcher automatiquement -->
        <a href="assets/pdf/Mentions_légales.pdf" download>mentions legales</a>
    </footer>

</body>

</html>
