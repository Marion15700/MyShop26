    <main>
        <section>

            <!-- creation d'un formulaire de contact -->
            <form action="" method="">
                <h2>Contactez nous!</h2>

                <fieldset>

                    <div>
                        <label for="nom">Nom: </label>
                        <input type="text" id="nom" placeholder="Votre nom" required>
                    </div>
                    <div>
                        <label for="prenom">Prénom: </label>
                        <input type="text" id="prenom" placeholder="Votre prénom" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="exemple@gmail.com" required>
                    </div>
                    <div>
                        <label for="message">Message: </label>
                        <textarea rows="5" id="message" placeholder="Votre message ici"></textarea>
                    </div>
                </fieldset>

                <button type="submit">Envoyer</button>

            </form>
        </section>
    </main>
