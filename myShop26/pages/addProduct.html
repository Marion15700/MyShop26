    <main>
        <section>

            <!-- creation d'un formulaire de contact -->
            <form action="" method="" id="formProduct">
                <h2>Ajouter des produits</h2>

                <fieldset>

                    <div>
                        <label for="nom">Nom: </label>
                        <input type="text" id="nom" required>
                    </div>
                    <div>
                        <label for="prix">Prix</label>
                        <input type="number" id="prix"  placeholder="prix" required>
                    </div>
                    <div>
                        <label for="description">Description: </label>
                        <textarea rows="2" id="description" placeholder="Votre description ici"></textarea>
                    </div>
                    <div>
                        <label for="imgURL">imgURL:</label>
                        <input type="text" id="imgURL" placeholder="l'image de votre produit ici" required>
                    </div>
                </fieldset>

                <button type="submit" class="btn-signUp">Envoyer</button>

            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="div-footer">
